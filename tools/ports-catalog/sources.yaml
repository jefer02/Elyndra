      es: "La versión original para Android de zelda3, la reimplementación en C de A Link to the Past."
    long:
      en: "An early Android port of snesrev's zelda3. It needs the asset file generated from your own ROM. Last updated in 2023; Moonpearl is the more complete option."
      es: "Un port temprano de zelda3 de snesrev para Android. Necesita el archivo de recursos generado desde tu propia ROM. Última actualización en 2023; Moonpearl es la opción más completa."
    requires:
      userRom: true
      text: {"en": "A zelda3_assets.dat extracted from your own USA ROM of A Link to the Past (see the repository's instructions).", "es": "Un zelda3_assets.dat extraído de tu propia ROM USA de A Link to the Past (ver las instrucciones del repositorio)."}
