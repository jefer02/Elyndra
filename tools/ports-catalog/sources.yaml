    long:
      en: "The game's x86 code is statically recompiled to C++ ahead of time and built for arm64, drawing through Vulkan. Saves live in a MostWanted folder on your storage so they survive reinstalls."
      es: "El código x86 del juego se recompila de antemano a C++ y se compila para arm64, dibujando con Vulkan. Las partidas se guardan en una carpeta MostWanted del almacenamiento, así sobreviven a una reinstalación."
