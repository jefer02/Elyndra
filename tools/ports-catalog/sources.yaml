  - repo: DoutorRaposo/moonpearl
    id: "moonpearl"
    game: "The Legend of Zelda: A Link to the Past"
    platform: "snes"
    port: "Moonpearl"
    developer: "DoutorRaposo (based on snesrev/zelda3)"
    kind: "reimpl"
    upstream: "snesrev/zelda3"
    featured: true
    asset: "(?i)^moonpearl.*\\.apk$"
    tags: ["adventure", "action", "widescreen", "rewind", "shaders"]
    short:
      en: "Android port of the zelda3 reimplementation of A Link to the Past: widescreen, rewind, shaders."
      es: "Port para Android de la reimplementación zelda3 de A Link to the Past: panorámica, rebobinado y shaders."
    long:
      en: "Moonpearl wraps snesrev's zelda3 (a full C reimplementation of A Link to the Past) in an Android app with widescreen, rewind, save states, RetroArch-style shaders, MSU-1 audio and controller support."
      es: "Moonpearl lleva zelda3 de snesrev (una reimplementación completa en C de A Link to the Past) a una app de Android con pantalla panorámica, rebobinado, estados de guardado, shaders al estilo de RetroArch, audio MSU-1 y soporte de mandos."
    requires:
      userRom: true
      text: {"en": "Your own SNES ROM of A Link to the Past (USA), as .sfc or .smc (zipped is fine). The app sets everything up from it; the ROM is not kept.", "es": "Tu propia ROM de SNES de A Link to the Past (USA), en .sfc o .smc (también comprimida). La app lo prepara todo a partir de ella y no la guarda."}
  - repo: Waterdish/zelda3-android
