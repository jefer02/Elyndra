      es: "Recompila de antemano el código PowerPC del juego sobre el SDK ReXGlue y lee el juego directamente de tu imagen de disco. Arranca y se puede correr, pero el rendimiento aún está lejos de la consola. Solo versiones preliminares."
    requires:
