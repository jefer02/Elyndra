# Candidates for the Elyndra ports catalog. generate.py runs the gates on every entry
# here (a failing one is excluded and logged in report.md; nothing else is excluded).
#
# Required: repo, game (the ORIGINAL game's name), platform (an Elyndra system id).
# Optional: id (never change it once published: installed ports are keyed by it), port,
# developer, kind (decomp|recomp|reimpl), upstream, featured, tags, short/long ({lang: text}),
# requires ({userRom, text, roms}), requirement (one English line), igdbId, sgdbId,
# steamAppId, releaseYear, art ({cover, hero, logo, icon, screenshots}), asset, abis, package.
# Discovery appends new candidates at the end with `discovered:`; `platformGuessed: true`
# means the platform was inferred from text: check it and delete the flag.

discovery:
  # Forks of these that mention Android become candidates (with this game name).
  upstreams:
    - HarbourMasters/Shipwright
    - HarbourMasters/2ship2harkinian
    - HarbourMasters/Starship
    - HarbourMasters/SpaghettiKart
    - HarbourMasters/Ghostship
    - snesrev/zelda3
    - fgsfdsfgs/perfect_dark
    - hedge-dev/UnleashedRecomp
    - Zelda64Recomp/Zelda64Recomp
    - coop-deluxe/sm64coopdx
    - OpenXcom/OpenXcom
    - ZeldaWWHDRecomp/ZeldaWWHDRecomp
  upstreamGames:
    HarbourMasters/Shipwright: "The Legend of Zelda: Ocarina of Time"
    HarbourMasters/2ship2harkinian: "The Legend of Zelda: Majora's Mask"
    HarbourMasters/Starship: "Star Fox 64"
    HarbourMasters/SpaghettiKart: "Mario Kart 64"
    HarbourMasters/Ghostship: "Super Mario 64"
    snesrev/zelda3: "The Legend of Zelda: A Link to the Past"
    fgsfdsfgs/perfect_dark: "Perfect Dark"
    hedge-dev/UnleashedRecomp: "Sonic Unleashed"
    Zelda64Recomp/Zelda64Recomp: "The Legend of Zelda: Majora's Mask"
    coop-deluxe/sm64coopdx: "Super Mario 64"
    OpenXcom/OpenXcom: "X-COM: UFO Defense"
    ZeldaWWHDRecomp/ZeldaWWHDRecomp: "The Legend of Zelda: The Wind Waker HD"

ports:
  # ── seeds (round 1) ──
  - repo: linkzenic/Shipwright-Ports
    aka: [linkzenic/Shipwright-Android]
    id: "soh"
    game: "The Legend of Zelda: Ocarina of Time"
    platform: "n64"
    port: "Ship of Harkinian"
    developer: "HarbourMasters · Android: linkzenic"
    kind: "decomp"
    upstream: "HarbourMasters/Shipwright"
    featured: true
    asset: "(?i)android.*\\.apk$"
    tags: ["adventure", "action", "widescreen", "60fps", "mods", "randomizer"]
    short:
      en: "Native PC port of Ocarina of Time, rebuilt from the decompilation, running natively on Android."
      es: "Port nativo de Ocarina of Time reconstruido desde la decompilación, funcionando de forma nativa en Android."
    long:
      en: "Ship of Harkinian runs Ocarina of Time natively from the zeldaret decompilation: widescreen, high frame rates, modern controls, a randomizer, cosmetics and mod support. This Android build is maintained by linkzenic on top of HarbourMasters' releases."
      es: "Ship of Harkinian ejecuta Ocarina of Time de forma nativa a partir de la decompilación de zeldaret: pantalla panorámica, tasas de imagen altas, controles modernos, aleatorizador, cosméticos y mods. Esta versión para Android la mantiene linkzenic sobre las releases de HarbourMasters."
    requires:
      userRom: true
      text: {"en": "Your own Ocarina of Time ROM (N64 NTSC/PAL, GameCube or Master Quest, in .z64 format). The app extracts the game data from it on first launch.", "es": "Tu propia ROM de Ocarina of Time (N64 NTSC/PAL, GameCube o Master Quest, en formato .z64). La app extrae los datos del juego al abrirla por primera vez."}
